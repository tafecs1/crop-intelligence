name: CropIntel

on:
  schedule:
    # v4.6 schedule – repo variable CROPINTEL_SCHEDULE (Settings → Secrets and variables → Actions → Variables):
    #   monthly (default / not set) = ALL INDIA on the 2nd of every month
    #   weekly                      = every Monday, states from CROPINTEL_STATES (not set = all India); no monthly run
    #   both                        = monthly all-India + weekly CROPINTEL_STATES
    - cron: '30 20 1 * *'          # 2nd of every month 02:00 IST (1st 20:30 UTC) – just after the Earth Engine quota reset
    - cron: '30 20 * * 0'          # every Monday 02:00 IST (Sunday 20:30 UTC); also keeps the shared cache alive
  workflow_dispatch:
    inputs:
      state_filter:
        description: 'States, comma-separated, e.g. Tamil Nadu,Kerala – ALL = all India (empty = repo variable CROPINTEL_STATES, else all India)'
        required: false
        default: ''
      shards:
        description: 'Parallel Earth Engine extraction jobs'
        required: false
        default: '6'
      rice_calibrate:
        description: 'Rice threshold calibration table (true/false) – use with a single state'
        required: false
        default: 'false'
      run_date:
        description: 'Leave empty (set automatically when a run resumes itself)'
        required: false
        default: ''
      resume_attempt:
        description: 'Leave 0 (counts automatic resumes)'
        required: false
        default: '0'

concurrency:
  group: cropintel
  cancel-in-progress: false

env:
  # v4.6: monthly schedule = ALL INDIA; weekly schedule = CROPINTEL_STATES (not set = all India);
  #       manual run = the States box (ALL = all India), else CROPINTEL_STATES, else all India.
  STATE_FILTER: ${{ github.event.schedule == '30 20 1 * *' && 'ALL' || (github.event.inputs.state_filter || vars.CROPINTEL_STATES || 'ALL') }}
  EXTRACT_BUDGET_MIN: '270'        # v4.4: start no new Earth Engine work after 4 h 30 min (job timeout 350 min; one restricted-mode batch can take ~1 h)
  RICE_CALIBRATE: ${{ github.event.inputs.rice_calibrate || 'false' }}
  # chosen rice thresholds: Settings → Secrets and variables → Actions → Variables (empty = defaults in crop_intel.py)
  RICE_VH_FLOOD_DB: ${{ vars.RICE_VH_FLOOD_DB }}
  RICE_VV_FLOOD_DB: ${{ vars.RICE_VV_FLOOD_DB }}
  RICE_VH_DROP_DB: ${{ vars.RICE_VH_DROP_DB }}
  RICE_VH_RISE_DB: ${{ vars.RICE_VH_RISE_DB }}
  PYTHONUNBUFFERED: '1'

jobs:
  setup:
    # v4.6: which scheduled runs go is set by CROPINTEL_SCHEDULE (monthly | weekly | both); manual runs always go
    if: ${{ github.event_name != 'schedule' || (github.event.schedule == '30 20 1 * *' && vars.CROPINTEL_SCHEDULE != 'weekly') || (github.event.schedule == '30 20 * * 0' && (vars.CROPINTEL_SCHEDULE == 'weekly' || vars.CROPINTEL_SCHEDULE == 'both')) }}
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.p.outputs.run_date }}
      shards: ${{ steps.p.outputs.shards }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - id: p
        run: |
          N="${{ github.event.schedule == '30 20 1 * *' && (vars.CROPINTEL_MONTHLY_SHARDS || '10') || (github.event.inputs.shards || vars.CROPINTEL_SHARDS || '6') }}"
          D="${{ github.event.inputs.run_date }}"
          echo "run_date=${D:-$(TZ=Asia/Kolkata date +%F)}" >> "$GITHUB_OUTPUT"
          echo "count=$N" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -c "import json;print(json.dumps(list(range($N))))")" >> "$GITHUB_OUTPUT"

  tests:                             # v4.0 automated tests (synthetic data, no Earth Engine) – extraction starts only if they pass
    if: ${{ github.event_name != 'schedule' || (github.event.schedule == '30 20 1 * *' && vars.CROPINTEL_SCHEDULE != 'weekly') || (github.event.schedule == '30 20 * * 0' && (vars.CROPINTEL_SCHEDULE == 'weekly' || vars.CROPINTEL_SCHEDULE == 'both')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q tests

  extract:                           # Earth Engine extraction, split by state across parallel jobs
    needs: [setup, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shards) }}
    env:
      RUN_DATE: ${{ needs.setup.outputs.run_date }}
      EXTRACT_ONLY: '1'
      SHARD_INDEX: ${{ matrix.shard }}
      SHARD_COUNT: ${{ needs.setup.outputs.count }}
      EE_KEY_JSON: ${{ secrets.EE_KEY_JSON }}
      EE_PROJECT: ${{ secrets.EE_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the shared Earth Engine cache (finished half-years + same-day work of an interrupted run)
        uses: actions/cache/restore@v4
        with:
          path: work/cache
          key: ee-cache-all-${{ github.run_id }}
          restore-keys: ee-cache-all-
      - run: python crop_intel.py
      - uses: actions/upload-artifact@v4          # v4.6: only the cache files this shard used (crop_intel.py → work/shard_out)
        with:
          name: cache-shard-${{ matrix.shard }}
          path: work/shard_out
          retention-days: 3

  build:                             # full pipeline from the cache → 8 tabs in the Google Sheet + Excel artifact
    needs: [setup, extract]
    if: ${{ !cancelled() && needs.setup.result == 'success' }}    # v4.6: never run when the weekly schedule was skipped
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      resume: ${{ steps.chk.outputs.resume }}
    env:
      SHARD_TOTAL: ${{ needs.setup.outputs.count }}     # v4.7: crashed shards → automatic resume
      RUN_DATE: ${{ needs.setup.outputs.run_date }}
      EE_KEY_JSON: ${{ secrets.EE_KEY_JSON }}
      EE_PROJECT: ${{ secrets.EE_PROJECT }}
      CROP_SHEET_ID: ${{ secrets.CROP_SHEET_ID }}
      SHEETS_KEY_JSON: ${{ secrets.SHEETS_KEY_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore the shared Earth Engine cache (so saving it below keeps all states' finished half-years)
        uses: actions/cache/restore@v4
        with:
          path: work/cache
          key: ee-cache-all-${{ github.run_id }}
          restore-keys: ee-cache-all-
      - uses: actions/download-artifact@v4
        with:
          pattern: cache-shard-*
          path: work/cache
          merge-multiple: true
      - name: Restore GGCMI calendar download
        uses: actions/cache@v4
        with:
          path: work/ggcmi
          key: ggcmi-phase3-v1.01
      - name: Restore CROPGRIDS crop-mix table (downloaded automatically on the first run)
        uses: actions/cache@v4
        with:
          path: work/cropgrids
          key: cropgrids-v1.07-india
      - run: python crop_intel.py
      - name: Save the shared Earth Engine cache (pruned by crop_intel.py; also after a stopped run, for the resume)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/cache
          key: ee-cache-all-${{ github.run_id }}
      - id: chk                    # v4.5: crop_intel.py writes work/RESUME_NEEDED when extraction stopped on the time budget
        if: always()
        run: |
          if [ -f work/RESUME_NEEDED ]; then echo "resume=true" >> "$GITHUB_OUTPUT"; else echo "resume=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CropIntel-Excel-${{ needs.setup.outputs.run_date }}
          path: |
            work/Crop_Intelligence_*.xlsx
            work/stage_report.md
            work/crop_phenology_db.csv
            work/validation_report.xlsx
          retention-days: 30

  resume:                            # v4.5: automatic same-date re-run when the time budget stopped extraction (max 3 resumes)
    needs: [setup, build]
    if: ${{ always() && needs.build.outputs.resume == 'true' && fromJSON(github.event.inputs.resume_attempt || '0') < 3 }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          N=$(( ${{ github.event.inputs.resume_attempt || '0' }} + 1 ))
          echo "Resume $N/3 for run date ${{ needs.setup.outputs.run_date }} (cached batches are reused)"
          gh workflow run cropintel.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" \
            -f state_filter="${{ env.STATE_FILTER }}" -f shards="${{ needs.setup.outputs.count }}" \
            -f rice_calibrate="${{ env.RICE_CALIBRATE }}" -f run_date="${{ needs.setup.outputs.run_date }}" \
            -f resume_attempt="$N"

  keepalive:                         # v4.6: GitHub deletes caches unused for 7 days – touch the shared cache every Monday
    if: ${{ github.event.schedule == '30 20 * * 0' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: work/cache
          key: ee-cache-all-keepalive
          restore-keys: ee-cache-all-
      - run: echo "Shared cache files kept alive:" && (ls work/cache 2>/dev/null | wc -l)
